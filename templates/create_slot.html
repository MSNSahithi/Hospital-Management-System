{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card-custom">
      <h2 class="fw-bold text-center">Create Availability Slot</h2>

      <form method="POST">
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-danger">{{ form.errors }}</div>
        {% endif %}

        <div class="mb-3">
          <label>Date</label>
          {{ form.date }}
        </div>

        <div class="mb-3">
          <label>Start Time</label>
          {{ form.start_time }}
        </div>

        <div class="mb-3">
          <label>End Time</label>
          {{ form.end_time }}
        </div>

        <button class="btn btn-primary btn-custom w-100">Create Slot</button>
      </form>

      <a href="/doctor/dashboard/" class="btn btn-outline-light btn-custom w-100 mt-3">Back</a>
    </div>
  </div>
</div>

{% endblock %}
