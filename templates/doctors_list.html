{% extends "base.html" %}
{% block content %}

<div class="card-custom mb-4">
  <h2 class="fw-bold">Doctors</h2>
</div>

<div class="card-custom">
  {% if doctors %}
    <table class="table table-dark table-striped">
      <tr><th>Doctor</th><th>Email</th><th>Action</th></tr>
      {% for d in doctors %}
      <tr>
        <td>{{ d.username }}</td>
        <td>{{ d.email }}</td>
        <td><a href="/doctors/{{ d.id }}/slots/" class="btn btn-sm btn-success">View Slots</a></td>
      </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No doctors found.</p>
  {% endif %}
</div>

{% endblock %}
