{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card-custom">
      <h2 class="fw-bold text-center">Patient Signup</h2>
      <form method="POST">
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-danger">{{ form.errors }}</div>
        {% endif %}
        <div class="mb-3">
          <label>Username</label>
          {{ form.username }}
        </div>

        <div class="mb-3">
          <label>Email</label>
          {{ form.email }}
        </div>

        <div class="mb-3">
          <label>Password</label>
          {{ form.password }}
        </div>

        <button class="btn btn-success btn-custom w-100">Signup</button>
      </form>

      <p class="mt-3 text-center">
        Already have account? <a href="/patient/login/" class="text-info">Login</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
